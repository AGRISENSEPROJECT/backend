name: Deploy API to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-api-vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test deployment recovery
        run: python3 -m unittest discover -s test/deployment -v

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --runInBand

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          : "${VPS_SSH_KEY:?Set VPS_SSH_KEY}"
          : "${VPS_KNOWN_HOSTS:?Set VPS_KNOWN_HOSTS}"
          : "${VPS_HOST:?Set VPS_HOST}"
          : "${VPS_USER:?Set VPS_USER}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync backend source to VPS
        run: |
          rsync -az --delete-delay \
            --exclude node_modules \
            --exclude dist \
            --exclude .git \
            --exclude .github \
            --exclude coverage \
            --exclude uploads \
            --exclude temp \
            --exclude '*.log' \
            --exclude .env \
            --exclude .env.* \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT:-22} -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "${VPS_USER}@${VPS_HOST}:/opt/agrisense/backend/"

      - name: Deploy API with automatic rollback
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "bash /opt/agrisense/backend/scripts/deploy-api.sh '${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"
